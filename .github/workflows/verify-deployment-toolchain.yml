name: Verify deployment build toolchain

on:
  workflow_dispatch:
  push:
    branches: [stage-6.3-aws-deployment]
    paths:
      - .github/workflows/verify-deployment-toolchain.yml
      - backend/src/**
      - infrastructure/template.yaml
      - infrastructure/auth-and-iam.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "11.19.0"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pull and run official SAM Python 3.12 build image
        shell: bash
        run: |
          set -euo pipefail
          sam --version
          test "$(pnpm --version)" = "11.19.0"

          image="public.ecr.aws/sam/build-python3.12:latest-x86_64"
          docker pull "$image"
          docker image inspect "$image" \
            --format='image_id={{.Id}} size_bytes={{.Size}} architecture={{.Architecture}} os={{.Os}}'
          docker run --rm --entrypoint python "$image" -c \
            'import platform, sys; print(platform.platform()); print(sys.version); assert sys.version_info[:2] == (3, 12)'

          sam build \
            --use-container \
            --template-file infrastructure/template.yaml \
            --parallel
          test -f .aws-sam/build/template.yaml
          tar -C .aws-sam -czf sam-python312-build.tar.gz build
          sha256sum sam-python312-build.tar.gz > sam-python312-build.tar.gz.sha256

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sam-python312-build-${{ github.run_id }}
          path: |
            sam-python312-build.tar.gz
            sam-python312-build.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Build frontend with pnpm 11.19.0
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.19.0"
          pnpm install --frozen-lockfile
          pnpm run build
