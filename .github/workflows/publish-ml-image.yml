name: Publish verified ML image to Sydney ECR

on:
  push:
    branches: [stage-6.3-aws-deployment]
    paths:
      - .github/workflows/publish-ml-image.yml
      - backend/**
      - legacy/**
      - tests/fixtures/images/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pba-ml-stage-6-3
  cancel-in-progress: false

env:
  PBA_ECR_ROLE_ARN: arn:aws:iam::835597620771:role/pba-prototype-github-ecr-push
  PBA_ECR_REPOSITORY_URI: 835597620771.dkr.ecr.ap-southeast-2.amazonaws.com/pacific-bioarchive-prototype-ml
  PBA_EXPECTED_OIDC_SUB: repo:weiwei0618seu@265754710/FIT5225_assignment2_PacificBioArchive-Prototype@1339555089:ref:refs/heads/stage-6.3-aws-deployment

jobs:
  publish:
    if: github.ref == 'refs/heads/stage-6.3-aws-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY_NAME: pacific-bioarchive-prototype-ml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Validate immutable target inputs
        env:
          ROLE_ARN: ${{ env.PBA_ECR_ROLE_ARN }}
          REPOSITORY_URI: ${{ env.PBA_ECR_REPOSITORY_URI }}
        run: |
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/pba-prototype-github-ecr-push$ ]]
          [[ "$REPOSITORY_URI" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-2\.amazonaws\.com/pacific-bioarchive-prototype-ml$ ]]

      - name: Validate branch-bound OIDC claims
        run: |
          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -er .value)"
          oidc_payload="${oidc_token#*.}"
          oidc_payload="${oidc_payload%%.*}"
          python - "$oidc_payload" "$PBA_EXPECTED_OIDC_SUB" <<'PY'
          import base64
          import json
          import sys

          encoded = sys.argv[1]
          encoded += "=" * (-len(encoded) % 4)
          claims = json.loads(base64.urlsafe_b64decode(encoded))
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "sts.amazonaws.com",
              "sub": sys.argv[2],
              "repository": "weiwei0618seu/FIT5225_assignment2_PacificBioArchive-Prototype",
              "ref": "refs/heads/stage-6.3-aws-deployment",
              "ref_type": "branch",
              "event_name": "push",
          }
          mismatches = {
              name: {"expected": value, "actual": claims.get(name)}
              for name, value in expected.items()
              if claims.get(name) != value
          }
          if mismatches:
              raise SystemExit(f"OIDC claim boundary mismatch: {json.dumps(mismatches, sort_keys=True)}")
          print("OIDC claims match the exact repository, owner IDs, branch and audience boundary.")
          PY

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ env.PBA_ECR_ROLE_ARN }}
          role-session-name: pba-stage-6-3-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Verify caller and ECR account match
        env:
          REPOSITORY_URI: ${{ env.PBA_ECR_REPOSITORY_URI }}
        run: |
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          repository_account="${REPOSITORY_URI%%.*}"
          test "$caller_account" = "$repository_account"

      - name: Verify LFS model objects
        run: |
          test "$(stat -c%s legacy/PacificBioArchive/mdv5a.pt)" -gt 100000000
          test "$(stat -c%s legacy/PacificBioArchive/model.pt)" -gt 100000000
          sha256sum legacy/PacificBioArchive/mdv5a.pt legacy/PacificBioArchive/model.pt

      - name: Build pinned Linux Lambda image
        run: docker build --file backend/Dockerfile.ml --tag pacific-bioarchive-ml:${{ github.sha }} .

      - name: Run supplied detector and classifier before publish
        run: |
          mkdir -p publish-evidence
          docker run --rm \
            --entrypoint python \
            --env PBA_DETECTOR_MODEL_PATH=/opt/models/mdv5a.pt \
            --env PBA_CLASSIFIER_MODEL_PATH=/opt/models/model.torchscript \
            --env PBA_LABELS_PATH=/opt/models/labels.txt \
            --env PBA_FORCE_CPU=true \
            --env PYTHONPATH=/var/task \
            --volume "${{ github.workspace }}/tests/fixtures/images:/fixtures:ro" \
            --volume "${{ github.workspace }}/legacy/PacificBioArchive:/source-models:ro" \
            --volume "${{ github.workspace }}/backend/scripts/smoke_real_models.py:/tmp/smoke_real_models.py:ro" \
            --volume "${{ github.workspace }}/publish-evidence:/evidence" \
            pacific-bioarchive-ml:${{ github.sha }} \
            /tmp/smoke_real_models.py \
            --detector /opt/models/mdv5a.pt \
            --classifier /opt/models/model.torchscript \
            --source-classifier /source-models/model.pt \
            --labels /opt/models/labels.txt \
            --fixture /fixtures/Alectura_lathami_1.JPG="australian brushturkey" \
            --fixture /fixtures/Casuarius_casuarius_1.JPG="southern cassowary" \
            --fixture /fixtures/Felis_catus_3.JPG="domestic cat" \
            --output /evidence/ecr-model-smoke.json

      - name: Push one commit-tagged image and record digest
        env:
          REPOSITORY_URI: ${{ env.PBA_ECR_REPOSITORY_URI }}
        run: |
          registry="${REPOSITORY_URI%/*}"
          image_tag="git-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag "pacific-bioarchive-ml:${GITHUB_SHA}" "${REPOSITORY_URI}:${image_tag}"
          docker push "${REPOSITORY_URI}:${image_tag}"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" --image-ids "imageTag=${image_tag}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_uri="${REPOSITORY_URI}@${digest}"
          docker image inspect "pacific-bioarchive-ml:${GITHUB_SHA}" \
            --format='{"local_image_id":"{{.Id}}","size_bytes":{{.Size}},"architecture":"{{.Architecture}}","os":"{{.Os}}"}' \
            > publish-evidence/local-container.json
          jq -n \
            --arg source_commit "$GITHUB_SHA" \
            --arg image_tag "$image_tag" \
            --arg image_uri "$image_uri" \
            '{source_commit:$source_commit,image_tag:$image_tag,image_uri:$image_uri}' \
            > publish-evidence/ecr-image.json
          cat publish-evidence/ecr-image.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ecr-publish-evidence-${{ github.run_id }}
          path: publish-evidence/
          retention-days: 30
          if-no-files-found: error
