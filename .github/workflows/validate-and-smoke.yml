name: Validate and smoke ML container

on:
  workflow_dispatch:
  push:
    branches: [stage-6.2-integration-e2e]
    paths:
      - .github/workflows/validate-and-smoke.yml
      - backend/**
      - frontend/**
      - infrastructure/**
      - legacy/**
      - tests/**

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "11.19.0"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend tests and lint
        run: |
          uv run --project backend --extra dev pytest -q backend/tests \
            --cov=pacific_bioarchive.domain \
            --cov=pacific_bioarchive.application \
            --cov-report=term-missing \
            --cov-fail-under=85
          uvx ruff check backend
      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test:run
          pnpm run build
          pnpm run lint
      - name: CloudFormation lint
        run: uvx --from cfn-lint cfn-lint infrastructure/template.yaml infrastructure/auth-and-iam.json

  model-container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Verify LFS model objects
        run: |
          test "$(stat -c%s legacy/PacificBioArchive/mdv5a.pt)" -gt 100000000
          test "$(stat -c%s legacy/PacificBioArchive/model.pt)" -gt 100000000
          sha256sum legacy/PacificBioArchive/mdv5a.pt legacy/PacificBioArchive/model.pt
      - name: Build pinned Linux Lambda image
        run: docker build --file backend/Dockerfile.ml --tag pacific-bioarchive-ml:${{ github.sha }} .
      - name: Run supplied detector and classifier in image
        run: |
          mkdir -p ci-evidence
          docker run --rm \
            --entrypoint python \
            --env PBA_DETECTOR_MODEL_PATH=/opt/models/mdv5a.pt \
            --env PBA_CLASSIFIER_MODEL_PATH=/opt/models/model.torchscript \
            --env PBA_LABELS_PATH=/opt/models/labels.txt \
            --env PBA_FORCE_CPU=true \
            --env PYTHONPATH=/var/task \
            --volume "${{ github.workspace }}/tests/fixtures/images:/fixtures:ro" \
            --volume "${{ github.workspace }}/legacy/PacificBioArchive:/source-models:ro" \
            --volume "${{ github.workspace }}/backend/scripts/smoke_real_models.py:/tmp/smoke_real_models.py:ro" \
            --volume "${{ github.workspace }}/ci-evidence:/evidence" \
            pacific-bioarchive-ml:${{ github.sha }} \
            /tmp/smoke_real_models.py \
            --detector /opt/models/mdv5a.pt \
            --classifier /opt/models/model.torchscript \
            --source-classifier /source-models/model.pt \
            --labels /opt/models/labels.txt \
            --fixture /fixtures/Alectura_lathami_1.JPG="australian brushturkey" \
            --fixture /fixtures/Casuarius_casuarius_1.JPG="southern cassowary" \
            --fixture /fixtures/Felis_catus_3.JPG="domestic cat" \
            --output /evidence/linux-model-smoke.json
      - name: Record immutable image evidence
        run: |
          docker image inspect pacific-bioarchive-ml:${{ github.sha }} \
            --format='{"image_id":"{{.Id}}","repo_digests":{{json .RepoDigests}},"size_bytes":{{.Size}},"architecture":"{{.Architecture}}","os":"{{.Os}}"}' \
            > ci-evidence/linux-container.json
          cat ci-evidence/linux-container.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-container-evidence-${{ github.run_id }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
