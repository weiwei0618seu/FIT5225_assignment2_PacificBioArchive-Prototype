[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacific-bioarchive"
version = "0.1.0"
description = "Serverless wildlife media platform for FIT5225 Assignment 2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
# Heavy ML versions are frozen in the ML container requirements after the
# supplied models pass a real Linux/Python 3.12 compatibility smoke test.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pacific_bioarchive"]

[tool.coverage.report]
show_missing = true
skip_covered = true

